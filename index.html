<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>平行四边形的面积转化探究实验室</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #e8f5e9 0%, #e1f5fe 55%, #fff8e1 100%);
    min-height: 100vh;
    padding: 14px;
    color: #263238;
    overflow-x: hidden;
  }
  .app { max-width: 960px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 1.45rem;
    color: #00695c;
    margin: 6px 0 14px;
    letter-spacing: 0.5px;
  }
  .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .tab {
    padding: 10px 18px; border-radius: 22px; border: 2px solid #4db6ac;
    background: #ffffff; color: #00695c; font-size: 0.98rem; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: all .2s;
  }
  .tab.active {
    background: #26a69a; border-color: #26a69a; color: #fff;
    box-shadow: 0 6px 16px rgba(38,166,154,.35);
  }
  .stage {
    background: #fff; border-radius: 18px; padding: 10px;
    box-shadow: 0 8px 26px rgba(38,166,154,.14);
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; border-radius: 12px; }
  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
  .ctrl {
    padding: 13px 26px; border-radius: 16px; border: none;
    font-size: 1.02rem; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: transform .12s, box-shadow .2s;
  }
  .ctrl:active { transform: scale(0.96); }
  .ctrl:disabled { opacity: 0.6; cursor: not-allowed; }
  .ctrl.primary {
    background: linear-gradient(135deg, #ffa726, #fb8c00); color: #fff;
    box-shadow: 0 6px 16px rgba(251,140,0,.35);
  }
  .ctrl.secondary {
    background: #eceff1; color: #455a64;
    box-shadow: 0 4px 10px rgba(0,0,0,.08);
  }
  .tip-bar {
    text-align: center; font-size: 1.02rem; color: #455a64;
    background: rgba(255,255,255,.8); border-radius: 14px;
    padding: 12px 16px; font-weight: 600; min-height: 46px;
    display: flex; align-items: center; justify-content: center;
    margin-top: 4px;
  }
  .formula-panel { text-align: center; margin: 12px 0; display: none; }
  .formula-panel.show { display: block; animation: fadeUp .5s ease; }
  .f-line { font-size: 1.25rem; font-weight: 700; color: #00695c; margin: 6px 0; }
  .f-line.highlight { font-size: 1.8rem; color: #d84315; letter-spacing: 2px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .confetti {
    position: fixed; top: -50px; pointer-events: none; z-index: 999;
    animation: fall 3s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>平行四边形的面积转化探究实验室</h1>
  <div class="tabs">
    <button class="tab active" data-module="1">① 动态框架</button>
    <button class="tab" data-module="2">② 剪拼转化</button>
    <button class="tab" data-module="3">③ 公式推导</button>
  </div>
  <div class="stage">
    <canvas id="stage"></canvas>
  </div>
  <div class="formula-panel" id="formulaPanel"></div>
  <div class="controls" id="controls"></div>
  <div class="tip-bar" id="tipBar"></div>
</div>

<script>
/* ============================================================
   基础设置
   ============================================================ */
const LOGICAL_W = 880;
const LOGICAL_H = 480;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

function initCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = LOGICAL_W * dpr;
  canvas.height = LOGICAL_H * dpr;
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
initCanvas();

/* ============================================================
   状态
   ============================================================ */
const state = { module: 1 };

/* ---------- 模块1：动态框架 ---------- */
const M1 = {
  cell: 42,
  Dx: 252,
  Dy: 378,
  base: 8,
  side: 5,
  maxT: 4,
  t: 0,
  dragging: false,
  dragStart: null
};

/* ---------- 模块2：剪拼转化 ---------- */
const M2 = {
  cell: 50,
  Ox: 200,
  Oy: 350,
  base: 6,
  height: 4,
  offset: 2,
  c: 2,
  cutDone: false,
  dragging: null,
  dragStart: null,
  shift: { x: 0, y: 0 },
  snapped: false
};

/* ---------- 模块3：公式推导（动态平移转化） ---------- */
const M3 = {
  cell: 50,
  Ox: 200,
  Oy: 350,
  base: 6,
  height: 4,
  offset: 2,
  progress: 0,
  playing: false,
  finished: false,
  rafId: null
};

/* ============================================================
   通用绘图工具
   ============================================================ */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawGrid(cell, anchorX, anchorY) {
  ctx.save();
  ctx.strokeStyle = '#dbe9f0';
  ctx.lineWidth = 1;
  const startX = ((anchorX % cell) + cell) % cell;
  for (let x = startX; x <= LOGICAL_W; x += cell) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, LOGICAL_H);
    ctx.stroke();
  }
  const startY = ((anchorY % cell) + cell) % cell;
  for (let y = startY; y <= LOGICAL_H; y += cell) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(LOGICAL_W, y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPoly(points, fill, stroke, lw) {
  if (!points || points.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw || 3;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
}

function drawHandle(x, y, color) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, 15, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, 9, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function label(text, x, y, color, align, size, bgColor) {
  align = align || 'center';
  size = size || 18;
  ctx.save();
  ctx.font = `bold ${size}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (bgColor) {
    const w = ctx.measureText(text).width;
    const padX = 10, padY = 6;
    let bx;
    if (align === 'center') bx = x - w / 2 - padX;
    else if (align === 'left') bx = x - padX;
    else bx = x - w - padX;
    ctx.fillStyle = bgColor;
    roundRect(bx, y - size / 2 - padY, w + padX * 2, size + padY * 2, 10);
    ctx.fill();
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawPanel(x, y, w, lines) {
  const lineH = 34;
  const h = lines.length * lineH + 16;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.12)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = 'rgba(255,255,255,0.97)';
  roundRect(x, y, w, h, 16);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.font = 'bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  lines.forEach((ln, i) => {
    ctx.fillStyle = ln.color || '#37474f';
    ctx.fillText(ln.text, x + 18, y + 16 + lineH * i + lineH / 2);
  });
  ctx.restore();
}

function pointInPolygon(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    const intersect = ((yi > pt.y) !== (yj > pt.y)) &&
      (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* ============================================================
   模块1：动态框架
   ============================================================ */
function m1GetPoints() {
  const { cell, Dx, Dy, base, side, t } = M1;
  const h = Math.sqrt(side * side - t * t);
  return {
    D: { x: Dx, y: Dy },
    C: { x: Dx + base * cell, y: Dy },
    A: { x: Dx + t * cell, y: Dy - h * cell },
    B: { x: Dx + (t + base) * cell, y: Dy - h * cell },
    h
  };
}

function drawModule1() {
  ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
  const { cell, base, side } = M1;
  const pts = m1GetPoints();

  drawGrid(cell, M1.Dx, M1.Dy);

  drawPoly([pts.D, pts.C, pts.B, pts.A], 'rgba(79,195,247,0.28)', '#0288d1', 3.5);

  ctx.beginPath();
  ctx.moveTo(pts.D.x, pts.D.y);
  ctx.lineTo(pts.C.x, pts.C.y);
  ctx.strokeStyle = '#e53935';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(pts.D.x, pts.D.y);
  ctx.lineTo(pts.A.x, pts.A.y);
  ctx.strokeStyle = '#43a047';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.stroke();

  drawHandle(pts.A.x, pts.A.y, '#2e7d32');
  drawHandle(pts.B.x, pts.B.y, '#01579b');

  label(`底 = ${base} 格`, (pts.D.x + pts.C.x) / 2, pts.D.y + 30,
    '#c62828', 'center', 18, 'rgba(255,255,255,0.92)');

  const mid = { x: (pts.D.x + pts.A.x) / 2, y: (pts.D.y + pts.A.y) / 2 };
  label(`邻边 = ${side} 格`, mid.x - 62, mid.y,
    '#2e7d32', 'center', 18, 'rgba(255,255,255,0.92)');

  const area = base * pts.h;
  const perimeter = 2 * (base + side);
  drawPanel(26, 26, 216, [
    { text: `底：${base} 格`, color: '#c62828' },
    { text: `邻边：${side} 格`, color: '#2e7d32' },
    { text: `周长：${perimeter} 格（不变）`, color: '#455a64' },
    { text: `面积：${area.toFixed(1)} 格`, color: '#1565c0' }
  ]);

  label('拖动顶点或图形，改变形状', LOGICAL_W - 26, 40,
    '#78909c', 'right', 17);
  label('观察：周长变了吗？面积变了吗？', LOGICAL_W - 26, 68,
    '#78909c', 'right', 17);
}

/* ============================================================
   模块2：剪拼转化
   ============================================================ */
function m2Points() {
  const { cell, Ox, Oy, base, height, offset } = M2;
  return {
    D: { x: Ox, y: Oy },
    C: { x: Ox + base * cell, y: Oy },
    A: { x: Ox + offset * cell, y: Oy - height * cell },
    B: { x: Ox + (base + offset) * cell, y: Oy - height * cell }
  };
}

function m2RightPiece() {
  const { cell, Ox, Oy, base, height, c } = M2;
  const A = { x: Ox + M2.offset * cell, y: Oy - height * cell };
  return [
    { x: Ox + c * cell, y: Oy },
    { x: Ox + base * cell, y: Oy },
    { x: Ox + (base + M2.offset) * cell, y: Oy - height * cell },
    { x: Ox + c * cell, y: A.y }
  ];
}

function m2LeftPiece(shiftX, shiftY) {
  const { cell, Ox, Oy, height, offset, c } = M2;
  const dx = shiftX * cell;
  const dy = shiftY * cell;
  return [
    { x: Ox + dx, y: Oy + dy },
    { x: Ox + c * cell + dx, y: Oy + dy },
    { x: Ox + c * cell + dx, y: Oy - height * cell + dy },
    { x: Ox + offset * cell + dx, y: Oy - height * cell + dy }
  ];
}

function drawScissors(x, y) {
  ctx.save();
  ctx.font = '40px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✂️', x, y);
  ctx.restore();
}

function drawModule2() {
  ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
  const { cell, height } = M2;
  drawGrid(cell, 0, 0);

  const pts = m2Points();

  if (!M2.cutDone) {
    drawPoly([pts.D, pts.C, pts.B, pts.A],
      'rgba(79,195,247,0.28)', '#0288d1', 3.5);

    const sx = M2.Ox + M2.c * cell;
    const topY = M2.Oy - height * cell;
    ctx.save();
    ctx.setLineDash([12, 9]);
    ctx.strokeStyle = '#ff6f00';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx, topY - 24);
    ctx.lineTo(sx, M2.Oy + 24);
    ctx.stroke();
    ctx.restore();

    drawScissors(sx, topY - 46);
    label('拖动剪刀线选位置', sx, topY - 82,
      '#ef6c00', 'center', 17, 'rgba(255,255,255,0.92)');

    label('底 = 6 格', M2.Ox + 3 * cell, M2.Oy + 34,
      '#c62828', 'center', 18, 'rgba(255,255,255,0.92)');

    if (Math.abs(M2.c - M2.offset) < 0.15) {
      label('沿顶点的高剪开', M2.Ox + 3 * cell, M2.Oy - height * cell - 130,
        '#5c6bc0', 'center', 17, 'rgba(255,255,255,0.92)');
    }

  } else {
    drawPoly(m2RightPiece(), 'rgba(79,195,247,0.28)', '#0288d1', 3.5);
    drawPoly(m2LeftPiece(M2.shift.x, M2.shift.y),
      'rgba(255,183,77,0.5)', '#ef6c00', 3.5);

    if (M2.snapped) {
      const rx = M2.Ox + M2.c * cell;
      const ry = M2.Oy - height * cell;
      const rw = M2.base * cell;
      const rh = height * cell;

      ctx.save();
      ctx.setLineDash([9, 7]);
      ctx.strokeStyle = '#2e7d32';
      ctx.lineWidth = 4;
      ctx.strokeRect(rx, ry, rw, rh);
      ctx.restore();

      label('拼成长方形啦！面积没有变', rx + rw / 2, ry - 40,
        '#2e7d32', 'center', 19, 'rgba(255,255,255,0.94)');
    } else {
      label('把橙色图形拖到右边', M2.Ox + 2 * cell, M2.Oy + 58,
        '#ef6c00', 'center', 18, 'rgba(255,255,255,0.94)');
    }

    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = 'rgba(120,144,156,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pts.D.x, pts.D.y);
    ctx.lineTo(pts.C.x, pts.C.y);
    ctx.lineTo(pts.B.x, pts.B.y);
    ctx.lineTo(pts.A.x, pts.A.y);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
}

/* ============================================================
   模块3：公式推导（动态平移转化）
   ============================================================ */
function drawModule3() {
  ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

  const { cell, base, height, offset } = M3;
  const p = M3.progress;

  drawGrid(cell, 0, 0);

  /* 关键点 */
  const D = { x: M3.Ox, y: M3.Oy };
  const C = { x: M3.Ox + base * cell, y: M3.Oy };
  const A = { x: M3.Ox + offset * cell, y: M3.Oy - height * cell };
  const B = { x: M3.Ox + (base + offset) * cell, y: M3.Oy - height * cell };
  const P = { x: M3.Ox + offset * cell, y: M3.Oy }; // 垂足

  /* 平移进度（0.2 之后开始，0.9 结束） */
  let moveProgress = 0;
  if (p > 0.2) {
    const t = Math.min((p - 0.2) / 0.7, 1);
    moveProgress = easeInOutCubic(t);
  }
  const shiftX = moveProgress * base * cell;

  /* 高线透明度：0-0.2 渐显，0.6-0.9 渐隐 */
  let lineAlpha = 0;
  if (p < 0.2) lineAlpha = p / 0.2;
  else if (p < 0.6) lineAlpha = 1;
  else if (p < 0.9) lineAlpha = 1 - (p - 0.6) / 0.3;
  else lineAlpha = 0;

  const isMerged = p > 0.9;

  /* 1. 原始平行四边形虚线轮廓（未拼合时显示） */
  if (p < 0.9) {
    ctx.save();
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = `rgba(120,144,156,${0.45 * (1 - p / 0.9)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(D.x, D.y);
    ctx.lineTo(C.x, C.y);
    ctx.lineTo(B.x, B.y);
    ctx.lineTo(A.x, A.y);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  /* 2. 右侧梯形（固定不动） */
  drawPoly([P, C, B, A], 'rgba(79,195,247,0.3)', '#0288d1', 3.5);

  /* 3. 左侧三角形（随进度平移） */
  const triD = { x: D.x + shiftX, y: D.y };
  const triP = { x: P.x + shiftX, y: P.y };
  const triA = { x: A.x + shiftX, y: A.y };

  const triFill = isMerged ? 'rgba(129,199,132,0.35)' : 'rgba(255,183,77,0.55)';
  const triStroke = isMerged ? '#2e7d32' : '#ef6c00';
  drawPoly([triD, triP, triA], triFill, triStroke, 3.5);

  /* 4. 高线（随三角形移动） */
  if (lineAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = lineAlpha;
    ctx.setLineDash([10, 6]);
    ctx.strokeStyle = '#ff6f00';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(triA.x, triA.y);
    ctx.lineTo(triP.x, triP.y);
    ctx.stroke();
    ctx.restore();

    /* 直角标记 */
    if (lineAlpha > 0.5) {
      ctx.save();
      ctx.globalAlpha = lineAlpha;
      ctx.strokeStyle = '#ff6f00';
      ctx.lineWidth = 3;
      const sz = 16;
      ctx.beginPath();
      ctx.moveTo(triP.x + sz, triP.y);
      ctx.lineTo(triP.x + sz, triP.y - sz);
      ctx.lineTo(triP.x, triP.y - sz);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* 5. 拼合完成：绘制长方形轮廓和高亮 */
  if (isMerged) {
    const rx = P.x;
    const ry = A.y;
    const rw = base * cell;
    const rh = height * cell;

    ctx.save();
    ctx.shadowColor = 'rgba(76,175,80,0.55)';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 5;
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.restore();

    /* 长方形底边（红） */
    ctx.beginPath();
    ctx.moveTo(rx, ry + rh);
    ctx.lineTo(rx + rw, ry + rh);
    ctx.strokeStyle = '#e53935';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.stroke();

    /* 长方形左边（绿） */
    ctx.beginPath();
    ctx.moveTo(rx, ry + rh);
    ctx.lineTo(rx, ry);
    ctx.strokeStyle = '#43a047';
    ctx.lineWidth = 7;
    ctx.stroke();
  }

  /* 6. 原平行四边形底边（红） */
  if (!isMerged) {
    ctx.beginPath();
    ctx.moveTo(D.x, D.y);
    ctx.lineTo(C.x, C.y);
    ctx.strokeStyle = '#e53935';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  /* 7. 标注 */
  if (!isMerged) {
    label(`底 = ${base} 格`, (D.x + C.x) / 2, D.y + 32,
      '#c62828', 'center', 18, 'rgba(255,255,255,0.92)');

    if (lineAlpha > 0.3) {
      label('高', triA.x - 32, (triA.y + triP.y) / 2,
        '#2e7d32', 'center', 18, 'rgba(255,255,255,0.9)');
    }
  } else {
    label('长 = 底', P.x + base * cell / 2, M3.Oy + 36,
      '#c62828', 'center', 20, 'rgba(255,255,255,0.94)');
    label('宽 = 高', P.x - 44, A.y + height * cell / 2,
      '#2e7d32', 'center', 20, 'rgba(255,255,255,0.94)');

    label('长等于底', P.x + base * cell / 2, A.y - 34,
      '#c62828', 'center', 16, 'rgba(255,255,255,0.88)');
    label('宽等于高', P.x - 44, A.y + height * cell / 2 + 38,
      '#2e7d32', 'center', 16, 'rgba(255,255,255,0.88)');
  }

  /* 8. 阶段提示 */
  let phaseText = '';
  if (p < 0.2) phaseText = '① 沿着高剪开';
  else if (p < 0.9) phaseText = '② 把三角形向右平移';
  else phaseText = '③ 拼成长方形，面积不变';

  label(phaseText, LOGICAL_W / 2, 50,
    p < 0.9 ? '#1565c0' : '#2e7d32', 'center', 22, 'rgba(255,255,255,0.94)');
}

/* ============================================================
   统一绘制入口
   ============================================================ */
function draw() {
  if (state.module === 1) drawModule1();
  else if (state.module === 2) drawModule2();
  else drawModule3();
}

/* ============================================================
   UI 更新
   ============================================================ */
function updateControls() {
  const controls = document.getElementById('controls');

  if (state.module === 1) {
    controls.innerHTML = `
      <button class="ctrl primary" id="btnM1New">换一题</button>
      <button class="ctrl secondary" id="btnM1Reset">恢复长方形</button>
    `;
    document.getElementById('btnM1New').onclick = () => {
      M1.t = (Math.random() * 2 - 1) * M1.maxT;
      draw();
    };
    document.getElementById('btnM1Reset').onclick = () => {
      M1.t = 0;
      draw();
    };

  } else if (state.module === 2) {
    if (!M2.cutDone) {
      controls.innerHTML = `
        <button class="ctrl primary" id="btnM2Cut">沿高剪开 ✂️</button>
        <button class="ctrl secondary" id="btnM2Reset">重新开始</button>
      `;
      document.getElementById('btnM2Cut').onclick = () => {
        M2.cutDone = true;
        M2.shift = { x: 0, y: 0 };
        M2.snapped = false;
        M2.dragging = null;
        draw();
        updateControls();
        updateTip();
        speak('沿高剪开了，把橙色图形拖到右边试试看');
      };
      document.getElementById('btnM2Reset').onclick = resetM2;

    } else if (!M2.snapped) {
      controls.innerHTML = `
        <button class="ctrl secondary" id="btnM2Reset">重新开始</button>
      `;
      document.getElementById('btnM2Reset').onclick = resetM2;

    } else {
      controls.innerHTML = `
        <button class="ctrl primary" id="btnM2Next">去推导公式 →</button>
        <button class="ctrl secondary" id="btnM2Reset">重新开始</button>
      `;
      document.getElementById('btnM2Next').onclick = () => switchModule(3);
      document.getElementById('btnM2Reset').onclick = resetM2;
    }

  } else {
    if (M3.playing) {
      controls.innerHTML = `
        <button class="ctrl secondary" disabled>演示中…</button>
      `;
    } else if (M3.finished) {
      controls.innerHTML = `
        <button class="ctrl primary" id="btnM3Replay">再看一次</button>
        <button class="ctrl secondary" id="btnM3Reset">重新开始</button>
      `;
      document.getElementById('btnM3Replay').onclick = playM3Animation;
      document.getElementById('btnM3Reset').onclick = resetM3;
    } else {
      controls.innerHTML = `
        <button class="ctrl primary" id="btnM3Play">▶ 播放转化动画</button>
        <button class="ctrl secondary" id="btnM3Reset">重新开始</button>
      `;
      document.getElementById('btnM3Play').onclick = playM3Animation;
      document.getElementById('btnM3Reset').onclick = resetM3;
    }
  }
}

function updateTip() {
  const bar = document.getElementById('tipBar');
  if (state.module === 1) {
    bar.textContent = '拖动顶点或图形：周长不变，面积变了吗？';
  } else if (state.module === 2) {
    if (!M2.cutDone) {
      bar.textContent = '拖动橙色剪刀线选择位置，然后点击「沿高剪开」。';
    } else if (!M2.snapped) {
      bar.textContent = '把橙色图形拖到右边，试着拼成一个长方形。';
    } else {
      bar.textContent = '太棒了！你拼成了长方形，面积没有变。';
    }
  } else {
    if (M3.playing) {
      bar.textContent = '正在演示：沿高剪开，平移拼成长方形……';
    } else if (M3.finished) {
      bar.textContent = '转化成功！长方形的长等于底，宽等于高，所以 S = ah。';
    } else {
      bar.textContent = '点击「播放转化动画」，观察平行四边形如何变成长方形。';
    }
  }
}

function updateFormulaPanel() {
  const panel = document.getElementById('formulaPanel');
  if (state.module === 3 && M3.finished) {
    panel.innerHTML = `
      <div class="f-line">长方形的面积 = 长 × 宽</div>
      <div class="f-line">平行四边形的面积 = 底 × 高</div>
      <div class="f-line highlight">S = a h</div>
    `;
    panel.classList.add('show');
  } else {
    panel.classList.remove('show');
    panel.innerHTML = '';
  }
}

function switchModule(n) {
  state.module = n;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', Number(t.dataset.module) === n);
  });
  draw();
  updateControls();
  updateTip();
  updateFormulaPanel();
}

function resetM2() {
  M2.c = 2;
  M2.cutDone = false;
  M2.dragging = null;
  M2.dragStart = null;
  M2.shift = { x: 0, y: 0 };
  M2.snapped = false;
  draw();
  updateControls();
  updateTip();
  updateFormulaPanel();
}

/* ============================================================
   模块3：动画控制
   ============================================================ */
function playM3Animation() {
  if (M3.playing) return;
  M3.playing = true;
  M3.finished = false;
  M3.progress = 0;

  updateControls();
  updateFormulaPanel();
  updateTip();

  const duration = 3600;
  const startTime = performance.now();

  function step(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    M3.progress = t;
    draw();

    if (t < 1) {
      M3.rafId = requestAnimationFrame(step);
    } else {
      M3.playing = false;
      M3.finished = true;
      M3.progress = 1;
      draw();
      updateControls();
      updateTip();
      updateFormulaPanel();
      celebrate();
      speak('长方形的长等于平行四边形的底，宽等于高，所以平行四边形的面积等于底乘高');
    }
  }

  M3.rafId = requestAnimationFrame(step);
}

function resetM3() {
  if (M3.rafId) {
    cancelAnimationFrame(M3.rafId);
    M3.rafId = null;
  }
  M3.playing = false;
  M3.finished = false;
  M3.progress = 0;
  draw();
  updateControls();
  updateTip();
  updateFormulaPanel();
}

/* ============================================================
   语音与庆祝
   ============================================================ */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.95;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  } catch (err) { /* 忽略 */ }
}

function celebrate() {
  const icons = ['⭐', '🎉', '✨', '🌟', '🎊'];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = icons[Math.floor(Math.random() * icons.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (16 + Math.random() * 20) + 'px';
    el.style.animationDelay = (Math.random() * 0.7) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3400);
  }
}

/* ============================================================
   指针交互（模块1和2）
   ============================================================ */
let activePointer = null;

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (LOGICAL_W / rect.width),
    y: (e.clientY - rect.top) * (LOGICAL_H / rect.height)
  };
}

function handleDown(pos) {
  if (state.module === 1) {
    const pts = m1GetPoints();
    const dA = Math.hypot(pos.x - pts.A.x, pos.y - pts.A.y);
    const dB = Math.hypot(pos.x - pts.B.x, pos.y - pts.B.y);
    const inside = pointInPolygon(pos, [pts.D, pts.C, pts.B, pts.A]);
    if (dA < 46 || dB < 46 || inside) {
      M1.dragging = true;
      M1.dragStart = { x: pos.x, t: M1.t };
    }

  } else if (state.module === 2) {
    if (!M2.cutDone) {
      const sx = M2.Ox + M2.c * M2.cell;
      const topY = M2.Oy - M2.height * M2.cell;
      if (Math.abs(pos.x - sx) < 50 && pos.y > topY - 60 && pos.y < M2.Oy + 60) {
        M2.dragging = 'scissors';
      }
    } else if (!M2.snapped) {
      const piece = m2LeftPiece(M2.shift.x, M2.shift.y);
      if (pointInPolygon(pos, piece)) {
        M2.dragging = 'piece';
        M2.dragStart = {
          x: pos.x,
          y: pos.y,
          sx: M2.shift.x,
          sy: M2.shift.y
        };
      }
    }
  }
}

function handleMove(pos) {
  if (state.module === 1 && M1.dragging) {
    const dx = (pos.x - M1.dragStart.x) / M1.cell;
    let t = M1.dragStart.t + dx;
    t = Math.max(-M1.maxT, Math.min(M1.maxT, t));
    M1.t = t;
    draw();

  } else if (state.module === 2) {
    if (M2.dragging === 'scissors') {
      let c = (pos.x - M2.Ox) / M2.cell;
      c = Math.max(M2.offset, Math.min(M2.base, c));
      M2.c = c;
      draw();

    } else if (M2.dragging === 'piece') {
      let nx = M2.dragStart.sx + (pos.x - M2.dragStart.x) / M2.cell;
      let ny = M2.dragStart.sy + (pos.y - M2.dragStart.y) / M2.cell;
      nx = Math.max(-6, Math.min(10, nx));
      ny = Math.max(-5, Math.min(5, ny));
      M2.shift.x = nx;
      M2.shift.y = ny;

      if (Math.hypot(nx - M2.base, ny) < 0.9) {
        M2.shift.x = M2.base;
        M2.shift.y = 0;
        onSnapSuccess();
      }
      draw();
    }
  }
}

function onSnapSuccess() {
  M2.snapped = true;
  M2.dragging = null;
  draw();
  updateControls();
  updateTip();
  speak('太棒了，拼成长方形啦，面积没有变');
  celebrate();
}

function handleUp() {
  if (state.module === 1) {
    M1.dragging = false;
  } else if (state.module === 2) {
    if (M2.dragging === 'piece') {
      if (Math.hypot(M2.shift.x - M2.base, M2.shift.y) < 0.9 && !M2.snapped) {
        M2.shift.x = M2.base;
        M2.shift.y = 0;
        onSnapSuccess();
      }
    }
    M2.dragging = null;
  }
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (activePointer !== null) return;
  activePointer = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  handleDown(getPos(e));
});

canvas.addEventListener('pointermove', e => {
  if (activePointer !== e.pointerId) return;
  e.preventDefault();
  handleMove(getPos(e));
});

canvas.addEventListener('pointerup', e => {
  if (activePointer !== e.pointerId) return;
  activePointer = null;
  handleUp();
});

canvas.addEventListener('pointercancel', e => {
  if (activePointer !== e.pointerId) return;
  activePointer = null;
  handleUp();
});

/* ============================================================
   标签切换
   ============================================================ */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    switchModule(Number(tab.dataset.module));
  });
});

/* ============================================================
   窗口变化
   ============================================================ */
window.addEventListener('resize', () => {
  initCanvas();
  draw();
});

/* ============================================================
   启动
   ============================================================ */
initCanvas();
draw();
updateControls();
updateTip();
updateFormulaPanel();
</script>
